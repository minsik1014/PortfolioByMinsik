<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>후기 작성하기 | NAMTANG</title>
  <style>
    body {
      background-color: #f9f9f9;
      font-family: 'Noto Sans KR', sans-serif;
      padding: 50px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 25px;
      color: #222;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 5px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    /* 별점 스타일 */
    .rating-stars {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-start;
      gap: 4px;
      margin-top: 5px;
    }

    .rating-stars input[type="radio"] {
      display: none;
    }

    .rating-stars label {
      font-size: 30px;
      color: #ccc;
      cursor: pointer;
      transition: color 0.2s;
    }

    .rating-stars input[type="radio"]:checked ~ label,
    .rating-stars label:hover,
    .rating-stars label:hover ~ label {
      color: #000;
    }

    .btns {
      margin-top: 25px;
      text-align: right;
    }

    .btns button {
      padding: 10px 20px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #222;
      color: #fff;
      transition: background-color 0.3s ease;
    }

    .btns button:hover {
      background-color: #444;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 13px;
      color: #666;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 후기 작성하기</h1>
    <form action="#" method="post">
      <label for="product">상품명</label>
      <input type="text" id="product" name="product" placeholder="예: 남성용 코트 검정 L">

      <label for="rating">별점</label>
      <div class="rating-stars">
        <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
        <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
        <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
        <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
        <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
      </div>

      <label for="content">후기 내용</label>
      <textarea id="content" name="content" placeholder="상품을 사용해 본 느낌을 자유롭게 작성해 주세요."></textarea>

      <div class="btns">
        <button type="submit">작성 완료</button>
      </div>
    </form>

    <a href="myPage.html" class="back-link">← 마이페이지로 돌아가기</a>
  </div>
</body>
</html>
